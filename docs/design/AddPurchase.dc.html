<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новая покупка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
:root{--bg:#0E0F13;--card:#1A1C22;--card-2:#2C2F37;--text:#F2F3F5;--muted:#8B8F98;--lime:#C8F25A;--on-lime:#1A2300;--lime-soft:#2A2D1A;--orange:#FF8A5B;--on-orange:#2B0E02;--font:-apple-system,"SF Pro Text",system-ui,sans-serif;--font-num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
.t-display{font-family:var(--font-num);font-size:40px;font-weight:700;letter-spacing:-0.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.t-headline{font-size:17px;font-weight:600}
.t-body{font-size:15px;font-weight:400}
.t-caption{font-size:13px;color:var(--muted)}
.t-label{font-size:12px;font-weight:500}
.bar{background:rgba(26,28,34,0.94);border:1px solid var(--card-2);border-radius:999px;padding:6px;display:flex;align-items:center;gap:6px}
.pill{border:0;border-radius:999px;padding:12px 16px;font-family:var(--font);font-size:15px;font-weight:600;background:transparent;color:var(--muted);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;flex:1}
.pill.on{background:var(--card-2);color:var(--text)}
.pill.lime{background:var(--lime);color:var(--on-lime)}
.circ{width:44px;height:44px;border-radius:50%;background:var(--card-2);color:var(--text);display:grid;place-items:center;border:0;flex-shrink:0}
.fab{width:58px;height:58px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;flex-shrink:0}
.who{background:var(--card);border:1px solid var(--card-2);border-radius:999px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:8px;color:var(--text);font-family:var(--font);font-size:15px;font-weight:500}
.who .a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: var(--font); display: flex; flex-direction: column; padding: 54px 20px 0; gap: 24px; overflow: hidden; position: relative">

  <div class="bar" style="align-self: flex-start; padding-right: 20px">
    <a href="Main.dc.html" class="circ" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <span class="t-headline">Новая покупка</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0">
    <input id="amount" aria-label="Сумма" value="2 400 ₸" inputmode="numeric" class="t-display" style="width: 100%; text-align: center; border: 0; background: transparent; color: var(--text); padding: 0; font-size: 56px">
    <input id="what" aria-label="Что купили" value="Хлеб, картошка, лук" class="t-body" style="width: 100%; text-align: center; border: 0; background: transparent; color: var(--muted); font-family: var(--font); padding: 0">
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span class="t-caption" style="padding-left: 6px">Кто платил</span>
    <div class="bar">
      <button type="button" class="pill lime">Я</button>
      <button type="button" class="pill">Айдос</button>
      <button type="button" class="pill">Даня</button>
      <button type="button" class="pill">Нурик</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span class="t-caption" style="padding-left: 6px">Как делить</span>
    <div class="bar">
      <button type="button" class="pill on">Поровну</button>
      <button type="button" class="pill">Свои суммы</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span class="t-caption" style="padding-left: 6px">На кого</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" class="who" style="border-color: var(--lime)"><span class="a" style="background: var(--lime); color: var(--on-lime)">Е</span>Я</button>
      <button type="button" class="who" style="border-color: var(--lime)"><span class="a" style="background: #2F5D8A">А</span>Айдос</button>
      <button type="button" class="who" style="border-color: var(--lime)"><span class="a" style="background: #8A5A2F">Д</span>Даня</button>
      <button type="button" class="who" style="color: var(--muted)"><span class="a" style="background: var(--card-2)">Н</span>Нурик</button>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; align-items: center; gap: 12px">
    <div class="bar" style="flex-grow: 1; padding: 6px 6px 6px 20px; height: 58px; box-sizing: border-box">
      <div style="display: flex; flex-direction: column; flex-grow: 1"><span class="t-headline">по 800 ₸</span><span class="t-caption">на 3 человек</span></div>
    </div>
    <a href="Purchase.dc.html" class="fab" aria-label="Поделить"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
