<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Очередь — сегодня</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#6a3fe0}a:hover{color:#4f2fc0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f6f9; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; color: #16132b; display: flex; flex-direction: column; padding: 58px 16px 18px; gap: 14px; overflow: hidden; position: relative">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.6px">Очередь</h1>
<button aria-label="Настройки очереди" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #16132b">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
</button>
</div>

<div style="display: flex; gap: 8px">
<button style="height: 36px; padding: 0 14px 0 10px; border-radius: 18px; border: 0; background: #16132b; color: #ffffff; font: 600 14px/1 inherit; display: flex; align-items: center; gap: 6px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10v3H7z"/><path d="M7 18a5 5 0 0 1-2-9.6A4 4 0 0 1 12 5a4 4 0 0 1 7 3.4A5 5 0 0 1 17 18"/></svg>Готовка</button>
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #e3e1ec; background: #ffffff; color: #6a6684; font: 500 14px/1 inherit">Мусор</button>
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #e3e1ec; background: #ffffff; color: #6a6684; font: 500 14px/1 inherit">Вода</button>
<button aria-label="Добавить дежурство" style="width: 36px; height: 36px; border-radius: 18px; border: 1px dashed #c9c5d9; background: transparent; color: #6a6684; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div style="position: relative; height: 196px; border-radius: 28px; background: #23124f; overflow: hidden; color: #ffffff; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
<svg width="230" height="230" viewBox="0 0 230 230" style="position: absolute; right: -54px; top: -20px" aria-hidden="true">
<circle cx="115" cy="115" r="108" fill="none" stroke="#3a2470" stroke-width="2"/>
<circle cx="115" cy="115" r="86" fill="#2c1860"/>
<circle cx="115" cy="115" r="58" fill="none" stroke="#ff8a3d" stroke-width="10" stroke-dasharray="9 7" opacity="0.95"/>
<circle cx="115" cy="115" r="58" fill="none" stroke="#ffc85a" stroke-width="3" stroke-dasharray="9 7" opacity="0.9"/>
<circle cx="115" cy="115" r="30" fill="#1a0d3d"/>
<circle cx="115" cy="115" r="12" fill="#3a2470"/>
<path d="M28 115h22M180 115h22M115 28v22M115 180v22" stroke="#3a2470" stroke-width="6" stroke-linecap="round"/>
</svg>
<div style="position: relative; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #c9b8ff; font-weight: 500">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #ff8a3d"></span>Сегодня у плиты · вт, 18 ноября</div>
<div style="position: relative; display: flex; align-items: center; gap: 12px">
<span style="width: 56px; height: 56px; border-radius: 28px; background: #c8f25a; color: #1a2300; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; box-shadow: 0 0 0 4px #23124f, 0 0 0 6px #ff8a3d">Е</span>
<div>
<div style="font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1">Готовишь ты</div>
<div style="font-size: 14px; color: #c9b8ff; margin-top: 3px">Завтра — Айдос</div>
</div>
</div>
<div style="position: relative; display: flex; gap: 8px">
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #ffffff; color: #23124f; font: 600 15px/1 inherit; display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Приготовил</button>
<a href="Swap.dc.html" style="height: 40px; padding: 0 16px; border-radius: 20px; background: #3a2470; color: #ffffff; font: 600 15px/1 inherit; display: flex; align-items: center; gap: 6px; text-decoration: none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>Поменяться</a>
</div>
</div>

<div style="background: #ffffff; border-radius: 24px; padding: 16px 14px 14px">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px 12px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Эта неделя</h2>
<a href="Calendar.dc.html" style="font-size: 14px; font-weight: 500; text-decoration: none">Ноябрь</a>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; border-radius: 16px; background: {{d.cellBg}}">
<span style="font-size: 11px; font-weight: 600; color: {{d.labelColor}}">{{d.dow}}</span>
<span style="position: relative; width: 36px; height: 36px; border-radius: 18px; background: {{d.bg}}; color: {{d.fg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-shadow: {{d.ring}}">
<span style="opacity: {{d.letterOpacity}}">{{d.who}}</span>
<sc-if value="{{d.done}}" hint-placeholder-val="{{false}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16132b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="position: absolute" role="img" aria-label="приготовлено"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</sc-if>
<sc-if value="{{d.swapped}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff; color: #6a3fe0; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(22,19,43,0.18)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="обмен"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg></span>
</sc-if>
</span>
<span style="font-size: 12px; font-weight: 600; color: {{d.labelColor}}">{{d.date}}</span>
</div>
</sc-for>
</div>
</div>

<div style="background: #ffffff; border-radius: 24px; padding: 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 12px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Порядок</h2>
<span style="font-size: 13px; color: #6a6684">по кругу · каждый день</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{order}}" as="p" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="width: 44px; height: 44px; border-radius: 22px; background: {{p.bg}}; color: {{p.fg}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; box-shadow: {{p.ring}}">{{p.letter}}</span>
<span style="font-size: 12px; font-weight: 500; color: #16132b; white-space: nowrap">{{p.name}}</span>
<span style="font-size: 11px; color: #6a6684">{{p.next}}</span>
</div>
</sc-for>
</div>
</div>

<nav style="position: absolute; left: 16px; right: 16px; bottom: 18px; display: flex; gap: 10px; align-items: center">
<div style="flex: 1; height: 58px; border-radius: 29px; background: #ffffff; box-shadow: 0 6px 20px rgba(22,19,43,0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 14px">
<a href="#" aria-label="Главная" style="color: #6a6684; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg></a>
<a href="#" aria-label="Покупки" style="color: #6a6684; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></a>
<span style="height: 46px; padding: 0 16px; border-radius: 23px; background: #efe9ff; color: #4f2fc0; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10v3H7z"/><path d="M7 18a5 5 0 0 1-2-9.6A4 4 0 0 1 12 5a4 4 0 0 1 7 3.4A5 5 0 0 1 17 18"/></svg>Очередь</span>
<a href="#" aria-label="Ежемесячно" style="color: #6a6684; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></a>
<a href="#" aria-label="Квартира" style="color: #6a6684; display: flex; margin-right: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .7 3 3 3 6"/></svg></a>
</div>
<button aria-label="Добавить" style="width: 58px; height: 58px; border-radius: 29px; border: 0; background: #6a3fe0; color: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(106,63,224,0.35)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var C = { E: '#c8f25a', A: '#ff8a3d', P: '#9b7bff', N: '#3b82f6' };
    var FG = { E: '#1a2300', A: '#2a1300', P: '#ffffff', N: '#ffffff' };
    function cell(dow, date, k, letter, state, swapped) {
      var past = state === 'done', today = state === 'today';
      return {
        dow: dow, date: date, who: letter, done: past, swapped: !!swapped,
        bg: past ? '#f1eff7' : C[k], fg: past ? '#16132b' : FG[k],
        letterOpacity: past ? 0.28 : 1,
        ring: today ? '0 0 0 3px #ffffff, 0 0 0 5px #6a3fe0' : 'none',
        cellBg: today ? '#efe9ff' : 'transparent',
        labelColor: today ? '#4f2fc0' : (past ? '#8c88a3' : '#6a6684')
      };
    }
    return {
      week: [
        cell('пн', '17', 'N', 'N', 'done', true),
        cell('вт', '18', 'E', 'Е', 'today', true),
        cell('ср', '19', 'A', 'А'),
        cell('чт', '20', 'P', 'П'),
        cell('пт', '21', 'N', 'N'),
        cell('сб', '22', 'E', 'Е'),
        cell('вс', '23', 'A', 'А')
      ],
      order: [
        { letter: 'Е', name: 'Ерасыл', next: 'сегодня', bg: C.E, fg: FG.E, ring: '0 0 0 3px #ffffff, 0 0 0 5px #6a3fe0' },
        { letter: 'А', name: 'Айдос', next: 'завтра', bg: C.A, fg: FG.A, ring: 'none' },
        { letter: 'П', name: 'Парасат', next: 'чт, 20', bg: C.P, fg: FG.P, ring: 'none' },
        { letter: 'N', name: 'Nurdaulet', next: 'пт, 21', bg: C.N, fg: FG.N, ring: 'none' }
      ]
    };
  }
}
</script>
</body>
</html>
